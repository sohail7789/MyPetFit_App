name: mypetfit_app
description: "Pet health assessment and product recommendation app"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^17.2.2
  smooth_page_indicator: ^2.0.1
  shared_preferences: ^2.3.5
  lottie: ^3.1.2
  # Renders the design's SVG icons/logos verbatim instead of approximating them.
  flutter_svg: ^2.0.10
  # Welcome / scoring / report-card motion.
  video_player: ^2.9.2
  firebase_core: ^4.12.1
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  google_sign_in: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    # Inter is bundled rather than fetched at runtime: google_fonts with
    # runtime fetching disabled threw on every text style because the font
    # was never in the bundle, so the app silently fell back to the system
    # face. This is the variable build, so one file covers every weight.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
  assets:
    # Artwork exported from the approved design system (see assets/README.md).
    - assets/v3/
