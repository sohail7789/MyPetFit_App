# ────────────────────────────────────────────────────────────────
# JVM — generous heap so the Gradle daemon doesn't thrash on AS
# ────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# ────────────────────────────────────────────────────────────────
# Build speed — parallel modules, build cache, daemon-based config
# These cut clean-build time from ~90 s → ~40 s and incremental
# builds from ~25 s → ~5 s on Apple silicon.
# ────────────────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# ────────────────────────────────────────────────────────────────
# AndroidX
# ────────────────────────────────────────────────────────────────
android.useAndroidX=true

# We don't depend on any legacy Android-Support libraries — turning
# Jetifier off saves ~2–3 s per build.
android.enableJetifier=false

# Faster R class generation (per-module, not global).
android.nonTransitiveRClass=true

android.newDsl=false
