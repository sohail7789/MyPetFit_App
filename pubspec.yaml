name: mypetfit_app
description: "Pet health assessment and product recommendation app"
publish_to: 'none'
version: 1.1.0+5

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^17.2.2
  smooth_page_indicator: ^2.0.1
  shared_preferences: ^2.3.5
  lottie: ^3.1.2
  # Renders the design's SVG icons/logos verbatim instead of approximating them.
  flutter_svg: ^2.0.10
  # Welcome / scoring / report-card motion.
  video_player: ^2.9.2
  firebase_core: ^4.12.1
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  google_sign_in: ^6.2.1
  pdf: ^3.12.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  printing: ^5.14.3
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  firebase_crashlytics: ^5.2.7
  # Hands "Find a vet near me" to the platform's maps app. The vet alert is
  # raised when the assessment says an animal needs professional attention,
  # and its primary action did nothing at all before this.
  url_launcher: ^6.3.1
  # Assessment-retake reminders. Scheduled on the device: the reminder is
  # derived from a date the app already holds, so it needs no server, no
  # push certificates and no FCM project — see lib/services/reminder_*.dart.
  flutter_local_notifications: ^19.4.2
  # zonedSchedule works in TZDateTime; these resolve the device's zone so a
  # reminder lands on the intended morning rather than drifting by the UTC
  # offset.
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real app on a device or emulator. The suites under
  # integration_test/ are deliberately built on fakes rather than production
  # Firebase — see integration_test/README.md.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image_picker_platform_interface: ^2.11.1

# Launcher icons only. The in-app artwork (assets/v3/logo.png) is a separate
# asset and is deliberately not referenced here.
#
# `app-icon.png` is the supplied master and is transparent. Transparency is
# flattened *before* generation rather than left to `remove_alpha_ios`, which
# composites onto black and is what turns a transparent logo into a black
# tile on the home screen. `app-icon-opaque.png` is that flatten onto white
# at 82%; `app-icon-foreground.png` is the same art, transparent, at 91% of
# the drawable — the generated adaptive XML insets it a further 16%, so it
# lands at ~62% of the icon, inside the mask's guaranteed-visible circle.
# Both are derived from the master; regenerate them from it, never by hand.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/v3/app-icon-opaque.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/v3/app-icon-foreground.png"
  # Belt and braces: the source is already opaque, so this has nothing left
  # to flatten. Kept because the App Store rejects an icon with an alpha
  # channel and this guarantees the 1024 has none.
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter:
  uses-material-design: true

  fonts:
    # Manrope is the face mypetfit.in uses, so the app and the site read as
    # one brand. Bundled rather than fetched at runtime: google_fonts with
    # runtime fetching disabled threw on every text style because the font
    # was never in the bundle, so the app silently fell back to the system
    # face. This is the variable build (200–800), so one file covers every
    # weight the design calls for.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
  assets:
    # Artwork exported from the approved design system (see assets/README.md).
    - assets/v3/
    # Static Manrope instances for the shared report PDF. The pdf package
    # embeds a single weight per Font, so it cannot use the variable build the
    # UI uses — these are wght=400 and wght=800 cut from the same file.
    - assets/pdf/
