name: mypetfit_app
description: "Pet health assessment and product recommendation app"
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^17.2.2
  smooth_page_indicator: ^2.0.1
  shared_preferences: ^2.3.5
  lottie: ^3.1.2
  # Renders the design's SVG icons/logos verbatim instead of approximating them.
  flutter_svg: ^2.0.10
  # Welcome / scoring / report-card motion.
  video_player: ^2.9.2
  firebase_core: ^4.12.1
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  google_sign_in: ^6.2.1
  pdf: ^3.12.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  printing: ^5.14.3
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image_picker_platform_interface: ^2.11.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/v3/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F1F0F6"
  adaptive_icon_foreground: "assets/v3/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  fonts:
    # Manrope is the face mypetfit.in uses, so the app and the site read as
    # one brand. Bundled rather than fetched at runtime: google_fonts with
    # runtime fetching disabled threw on every text style because the font
    # was never in the bundle, so the app silently fell back to the system
    # face. This is the variable build (200–800), so one file covers every
    # weight the design calls for.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
  assets:
    # Artwork exported from the approved design system (see assets/README.md).
    - assets/v3/
    # Static Manrope instances for the shared report PDF. The pdf package
    # embeds a single weight per Font, so it cannot use the variable build the
    # UI uses — these are wght=400 and wght=800 cut from the same file.
    - assets/pdf/
